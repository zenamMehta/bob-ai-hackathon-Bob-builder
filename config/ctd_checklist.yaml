# ICH M4 CTD Required Structure — Single Source of Truth
# Used by submission_readiness.py for gap analysis.
# Each section has:
#   id:        short dot-notation reference (e.g. 1.1)
#   name:      canonical section title as per ICH M4 guidance
#   risk_note: plain-English regulatory risk if this section is absent

modules:

  - module_id: m1
    module_name: "Module 1 – Administrative and Regional Information"
    sections:
      - id: "1.1"
        name: "Table of Contents"
        risk_note: "Absence of a Table of Contents makes the dossier non-navigable; most agencies will return the submission without review."
      - id: "1.2"
        name: "Application Form"
        risk_note: "The Application Form is a mandatory administrative document; its absence triggers an immediate completeness check failure."
      - id: "1.3"
        name: "Product Information / Labelling"
        risk_note: "Missing product labelling prevents assessment of proposed prescribing information and is grounds for rejection."
      - id: "1.4"
        name: "Information About the Experts"
        risk_note: "Expert declarations are required to authenticate the quality, nonclinical, and clinical summaries; absence may invalidate those modules."
      - id: "1.5"
        name: "Specific Requirements for Different Types of Applications"
        risk_note: "Omitting region-specific requirements (e.g. orphan designation, paediatric plan) causes regulatory-pathway compliance gaps."
      - id: "1.6"
        name: "Environmental Risk Assessment"
        risk_note: "An Environmental Risk Assessment is mandatory for GMO-derived products and many biologics; absence delays approval in the EU and other markets."
      - id: "1.7"
        name: "Certificate of Suitability (CEP) or Drug Master File Reference"
        risk_note: "Without a CEP or DMF reference, the quality of starting materials cannot be verified independently."
      - id: "1.8"
        name: "Information Relating to Pharmacovigilance"
        risk_note: "Missing pharmacovigilance information (RMP or equivalent) prevents regulators from assessing post-market safety commitments."

  - module_id: m2
    module_name: "Module 2 – Common Technical Document Summaries"
    sections:
      - id: "2.1"
        name: "CTD Table of Contents"
        risk_note: "A CTD-level Table of Contents is mandatory for structured navigation; its absence is a format non-compliance."
      - id: "2.2"
        name: "Introduction to the Summary Documents"
        risk_note: "Without this introduction, reviewers lack the framing context to interpret the quality, nonclinical, and clinical summaries."
      - id: "2.3"
        name: "Quality Overall Summary"
        risk_note: "The Quality Overall Summary is a required synthesising document; its absence means Module 3 data cannot be assessed holistically."
      - id: "2.4"
        name: "Nonclinical Overview"
        risk_note: "Absence of the Nonclinical Overview leaves Module 4 study reports without interpretive context, delaying review."
      - id: "2.5"
        name: "Clinical Overview"
        risk_note: "The Clinical Overview is required to justify the benefit-risk conclusion; its absence is a critical gap that will halt review."
      - id: "2.6"
        name: "Nonclinical Written and Tabulated Summary"
        risk_note: "Missing nonclinical tabulated summaries force reviewers to manually extract data from individual study reports, causing significant delays."
      - id: "2.7"
        name: "Clinical Summary"
        risk_note: "The Clinical Summary aggregates all clinical evidence; its absence makes it impossible to assess the integrated benefit-risk profile."

  - module_id: m3
    module_name: "Module 3 – Quality (Chemistry, Manufacturing, and Controls)"
    sections:
      - id: "3.1"
        name: "Table of Contents for Module 3"
        risk_note: "A module-level Table of Contents is required for CMC navigation; its absence may cause the dossier to be returned for reformatting."
      - id: "3.2.S"
        name: "Drug Substance"
        risk_note: "The Drug Substance section is foundational to CMC review; its absence means the active pharmaceutical ingredient cannot be assessed."
      - id: "3.2.S.1"
        name: "General Information – Drug Substance"
        risk_note: "Without general drug substance information, the INN, molecular formula, and structural properties cannot be confirmed."
      - id: "3.2.S.2"
        name: "Manufacture of Drug Substance"
        risk_note: "Missing manufacturing details prevent assessment of process controls and reproducibility, a critical CMC requirement."
      - id: "3.2.S.3"
        name: "Characterisation of Drug Substance"
        risk_note: "Absence of characterisation data (structure elucidation, impurities) is a major deficiency that will generate a question in any review."
      - id: "3.2.S.4"
        name: "Control of Drug Substance"
        risk_note: "Without specifications and analytical procedures for the drug substance, batch release criteria cannot be evaluated."
      - id: "3.2.S.5"
        name: "Reference Standards or Materials"
        risk_note: "Missing reference standard information makes analytical results unverifiable."
      - id: "3.2.S.6"
        name: "Container Closure System – Drug Substance"
        risk_note: "Absent container closure data for the drug substance raises concerns about storage stability and contamination risk."
      - id: "3.2.S.7"
        name: "Stability of Drug Substance"
        risk_note: "Drug substance stability data is mandatory to justify shelf-life and storage conditions; its absence is a critical omission."
      - id: "3.2.P"
        name: "Drug Product"
        risk_note: "The Drug Product section is mandatory; without it, the finished dosage form cannot be assessed for quality and safety."
      - id: "3.2.P.1"
        name: "Description and Composition of Drug Product"
        risk_note: "Missing formulation composition prevents evaluation of excipient safety and dosage form design."
      - id: "3.2.P.2"
        name: "Pharmaceutical Development"
        risk_note: "Absence of pharmaceutical development data means the rationale for formulation choices cannot be assessed."
      - id: "3.2.P.3"
        name: "Manufacture of Drug Product"
        risk_note: "Without manufacturing process details, GMP compliance and batch reproducibility cannot be verified."
      - id: "3.2.P.4"
        name: "Control of Excipients"
        risk_note: "Missing excipient controls may raise safety concerns, especially for novel or high-risk excipients."
      - id: "3.2.P.5"
        name: "Control of Drug Product"
        risk_note: "Absent drug product specifications are a critical CMC deficiency; batch release cannot be evaluated."
      - id: "3.2.P.6"
        name: "Reference Standards or Materials – Drug Product"
        risk_note: "Without reference standards for the drug product, analytical test methods cannot be verified."
      - id: "3.2.P.7"
        name: "Container Closure System – Drug Product"
        risk_note: "Missing container closure data for the drug product is required to confirm product protection and compatibility."
      - id: "3.2.P.8"
        name: "Stability of Drug Product"
        risk_note: "Drug product stability data directly supports proposed shelf-life labelling; its absence is a critical deficiency."

  - module_id: m4
    module_name: "Module 4 – Nonclinical Study Reports"
    sections:
      - id: "4.1"
        name: "Table of Contents for Module 4"
        risk_note: "Module 4 Table of Contents is required for structured navigation of nonclinical reports."
      - id: "4.2.1"
        name: "Pharmacology – Primary Pharmacodynamics"
        risk_note: "Primary pharmacodynamics data establishes mechanism of action; its absence leaves the therapeutic rationale unsupported."
      - id: "4.2.2"
        name: "Pharmacology – Secondary Pharmacodynamics"
        risk_note: "Missing secondary pharmacodynamics data may conceal off-target effects relevant to safety assessment."
      - id: "4.2.3"
        name: "Pharmacology – Safety Pharmacology"
        risk_note: "Safety pharmacology studies (e.g. cardiac, CNS, respiratory) are ICH S7A requirements; their absence is a critical nonclinical gap."
      - id: "4.2.4"
        name: "Pharmacology – Pharmacodynamic Drug Interactions"
        risk_note: "Absence of pharmacodynamic interaction data may mask combination-use risks."
      - id: "4.2.5"
        name: "Pharmacokinetics"
        risk_note: "PK data is fundamental to dose selection and safety margin calculation; its absence is a critical deficiency."
      - id: "4.2.6"
        name: "Single-Dose Toxicity"
        risk_note: "Single-dose toxicity studies define acute exposure limits; missing data leaves dose-safety margins undefined."
      - id: "4.2.7"
        name: "Repeat-Dose Toxicity"
        risk_note: "Repeat-dose toxicity is required to support proposed clinical dosing durations; its absence may limit the approved indication."
      - id: "4.2.8"
        name: "Genotoxicity"
        risk_note: "Genotoxicity studies are required for all new chemical entities; absence is a regulatory blocker."
      - id: "4.2.9"
        name: "Carcinogenicity"
        risk_note: "Carcinogenicity studies are required for drugs intended for chronic use; missing data will trigger a major objection."
      - id: "4.2.10"
        name: "Reproductive and Developmental Toxicity"
        risk_note: "DART studies are required to support pregnancy labelling; their absence prevents classification of reproductive risk."
      - id: "4.2.11"
        name: "Local Tolerance"
        risk_note: "Local tolerance data is required for parenteral and topical products; absence is a deficiency for such routes of administration."

  - module_id: m5
    module_name: "Module 5 – Clinical Study Reports"
    sections:
      - id: "5.1"
        name: "Table of Contents for Module 5"
        risk_note: "Module 5 Table of Contents is required for navigation of clinical evidence; its absence is a format non-compliance."
      - id: "5.2"
        name: "Tabular Listing of All Clinical Studies"
        risk_note: "Without a tabular study listing, reviewers cannot confirm the completeness of the clinical development programme."
      - id: "5.3.1"
        name: "Reports of Biopharmaceutic Studies"
        risk_note: "Biopharmaceutic study reports support bioavailability and bioequivalence conclusions; absence is a deficiency for oral and complex formulations."
      - id: "5.3.2"
        name: "Reports of Studies Relevant to Pharmacokinetics"
        risk_note: "PK study reports are needed to characterise absorption, distribution, metabolism, and excretion; their absence leaves dosing rationale unsupported."
      - id: "5.3.3"
        name: "Reports of Human Pharmacodynamic Studies"
        risk_note: "Human PD study reports link drug exposure to pharmacological effect; missing data weakens the dose-response justification."
      - id: "5.3.4"
        name: "Reports of Efficacy and Safety Studies"
        risk_note: "Pivotal efficacy and safety study reports are the core of Module 5; their absence is a critical deficiency that will halt the review."
      - id: "5.3.5"
        name: "Reports of Post-Marketing Experience"
        risk_note: "Post-marketing experience reports are required for line extensions; their absence is a gap for products with prior approvals."
      - id: "5.3.6"
        name: "Reference List"
        risk_note: "A reference list for clinical literature citations is required for transparency and cross-referencing during review."
      - id: "5.3.7"
        name: "Synopsis of Individual Studies"
        risk_note: "Individual study synopses allow rapid review of each trial; their absence forces reviewers into full-length reports, significantly delaying assessment."
      - id: "5.4"
        name: "Literature References"
        risk_note: "Bibliographic literature references are required to support any claims based on published evidence."
