submission:
  title: "Drug Safety Signal Detector & Regulatory Submission Readiness Checker"

  problem_statement: >
    Pharmacovigilance teams must monitor 20M+ adverse event reports in FAERS to
    catch dangerous drug safety signals before they cause harm — Vioxx caused
    27,000+ heart attacks before its signal was formally acted on. Regulatory
    affairs teams face a parallel problem: a CTD dossier spans 100,000+ pages
    across five modules, and a single missing or incorrectly named section
    triggers a rejection costing 6–12 months and $50–100M. Both teams face the
    same root cause: too much complex, high-stakes data for manual review to
    catch reliably.

  solution_summary: >
    A single Streamlit application with two modes, built using IBM Bob. Signal
    Detection computes the Proportional Reporting Ratio (PRR) and chi-squared
    statistic for every drug-event pair in an adverse event dataset, flagging
    signals against standard pharmacovigilance thresholds — including correct
    handling of drug-exclusive reactions as infinite-PRR signals while guarding
    against single-report flukes. Submission Readiness compares a CTD dossier
    outline against the ICH M4 required structure using fuzzy string matching,
    scoring completeness per module and generating a gap report with
    regulator-facing risk notes.

  key_features:
    - "PRR and chi-squared disproportionality analysis per drug-event pair (Evans 2001 method)"
    - "PRR = Inf (event exclusivity) handling with chi-squared waiver and case-count fluke guard"
    - "ICH M4 CTD fuzzy section matching with per-module completeness scoring"
    - "Regulator-facing gap reports with plain-English risk notes per missing section"
    - "Fully offline rule-based summaries — zero external API calls, works on synthetic or uploaded data"

  tech_stack:
    languages: Python
    frameworks: Streamlit
    ibm_technologies: IBM BoB
    databases: []
    other: ["pandas", "scipy", "rapidfuzz", "PyYAML", "GitHub Actions"]

  what_we_are_most_proud_of: >
    The rigorous, standards-faithful implementation of the Evans (2001) PRR
    algorithm — including principled handling of the PRR = Inf edge case
    (event exclusivity), the chi-squared waiver for degenerate 2x2 tables,
    and the three-threshold flagging logic. The result is pharmacovigilance
    signal detection that a real regulatory scientist would recognise as
    methodologically sound, not just a demonstration.

  known_limitations: >
    No authentication — this is a local prototype, not production-ready.
    The row-by-row loop in compute_signals is clear and correct at demo scale
    but will be slow on full FAERS (millions of rows); a vectorised pandas
    implementation would be needed for production. Fuzzy matching is greedy
    (first-match), which can occasionally mis-assign sections when two required
    names are very similar. No demo video has been recorded yet.

